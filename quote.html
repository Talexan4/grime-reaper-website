        <script>
function showServiceOptions() {

    const service = document.getElementById("serviceType").value;

    const detailing = document.getElementById("detailingOptions");
    const powerWashing = document.getElementById("powerWashingOptions");
    const residential = document.getElementById("residentialOptions");
    const commercial = document.getElementById("commercialOptions");

    detailing.style.display = "none";
    powerWashing.style.display = "none";
    residential.style.display = "none";
    commercial.style.display = "none";

    if (service === "Detailing") {
        detailing.style.display = "block";
    }

    if (service === "Power Washing") {
        powerWashing.style.display = "block";
    }
}


function showPowerWashingOptions() {

    const type = document.getElementById("powerWashingType").value;

    const residential = document.getElementById("residentialOptions");
    const commercial = document.getElementById("commercialOptions");

    residential.style.display = "none";
    commercial.style.display = "none";

    if (type === "Residential") {
        residential.style.display = "block";
    }

    if (type === "Commercial") {
        commercial.style.display = "block";
    }
}
</script>
